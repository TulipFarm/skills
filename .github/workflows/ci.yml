name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 1 & 2: manifest <-> skills consistency + SKILL.md frontmatter validation
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/validate-marketplace.mjs

  # 4: markdown hygiene
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            AGENTS.md

  # 4: dead-link check
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress '**/*.md'"
          fail: true
